name: Generate Release Keystore (one-off)

# 临时 workflow：在 GitHub runner 上生成 release keystore 并作为 artifact 下载。
# 用途——给本地未装 JDK 的环境产出 release.keystore 文件，配置正式签名 secrets。
# ⚠️ 一次性使用：拿到 keystore 文件 + 配好 secrets 后删除本文件。
# artifact retention 设 1 天——下载后立即去 Actions 删除该次运行，避免 keystore 长期留存。

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 密码写死在此处仅因本 workflow 是一次性的——拿到 keystore 后立即删除本文件即清除痕迹。
      # keystore 文件本身才是长期机密，需保存到密码管理器；密码同名便于记忆。
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias knowmo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "KnowMo@Release@2026!" \
            -keypass "KnowMo@Release@2026!" \
            -dname "CN=KnowMo, OU=Dev, O=KnowMo, L=Beijing, ST=Beijing, C=CN"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          if-no-files-found: error
          retention-days: 1
