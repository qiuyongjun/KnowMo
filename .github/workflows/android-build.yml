name: Android APK Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 构建 job：仅读权限，main push / 手动执行都走这里产出 Debug APK artifact
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowmo-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 发布 job：仅 tag 触发，需要写权限创建 Release；用 release keystore 签名产出可覆盖升级的正式 APK
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 从 tag 名（v0.3.0）提取版本号：versionName 去掉 v 前缀，versionCode 用 run number 保证自增可覆盖升级
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # 从 Secret 解码 keystore。⚠️ 2026-09-23 复审修复（#5）：先校验四个 Secret 齐全，
      # 缺任一个立即失败并给出明确指引。刻意不回退 debug 签名：发布正式 APK 用 debug 签名
      # 无法覆盖升级，宁可失败。
      # 密码类变量不写 GITHUB_ENV（2026-09-23 复审修复）：GITHUB_ENV 对后续所有步骤——
      # 包括第三方 action——可见，等于把签名密码泄漏给整条流水线；改由 Build 步骤的
      # 步骤级 env 直接引用 Secret（只在单步内可见）。本步骤只解码 keystore 文件并输出路径。
      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release 签名 Secret 未配置：${missing[*]}。请在仓库 Settings > Secrets and variables > Actions 配置后重打 tag。"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > $HOME/release.keystore
          echo "path=$HOME/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gradle assembleRelease \
            --no-daemon --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowmo-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
